name: Bug report
description: Report reproducible unexpected behavior
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, provider, and synthetic input. Remove private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit and environment
      placeholder: Commit hash, OS, Docker version
